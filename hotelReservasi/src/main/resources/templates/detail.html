<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Hotel Reservasi'">Detail Reservasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-building"></i> Hotel Reservasi
            </a>
            <span class="navbar-text text-light">
                <i class="bi bi-person-circle"></i> Ahmad Zidan
            </span>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Beranda</a></li>
                <li class="breadcrumb-item active">Detail Reservasi</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-info-circle"></i> Detail Reservasi #<span th:text="${reservasi.id}">1</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Nama Tamu</div>
                            <div class="col-sm-8 fs-5 fw-bold" th:text="${reservasi.namaTamu}">-</div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Tipe Kamar</div>
                            <div class="col-sm-8">
                                <span class="badge rounded-pill bg-primary fs-6"
                                    th:text="${reservasi.tipeKamar}">-</span>
                            </div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Nomor Kamar</div>
                            <div class="col-sm-8 fw-bold" th:text="${reservasi.nomorKamar}">-</div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Tanggal Check-In</div>
                            <div class="col-sm-8"
                                th:text="${#temporals.format(reservasi.tanggalCheckIn, 'dd MMMM yyyy')}">-</div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Tanggal Check-Out</div>
                            <div class="col-sm-8"
                                th:text="${#temporals.format(reservasi.tanggalCheckOut, 'dd MMMM yyyy')}">-</div>
                        </div>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-semibold text-muted">Status</div>
                            <div class="col-sm-8">
                                <span class="badge rounded-pill fs-6"
                                    th:classappend="${reservasi.status == 'AKTIF'} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${reservasi.status}">-</span>
                            </div>
                        </div>

                        <!-- Tombol Aksi -->
                        <div class="d-flex gap-2 mt-4">
                            <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-arrow-left"></i> Kembali
                            </a>
                            <a th:href="@{/reservasi/edit/{id}(id=${reservasi.id})}" class="btn btn-warning btn-lg"
                                th:if="${reservasi.status == 'AKTIF'}">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a th:href="@{/reservasi/checkout/{id}(id=${reservasi.id})}" class="btn btn-success btn-lg"
                                th:if="${reservasi.status == 'AKTIF'}"
                                onclick="return confirm('Yakin ingin check-out tamu ini?')">
                                <i class="bi bi-box-arrow-right"></i> Check-Out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-light text-center py-3">
        <small>&copy; 2026 Ahmad Zidan - Tugas Pemrograman 2 | Spring Boot + Thymeleaf + MySQL</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
