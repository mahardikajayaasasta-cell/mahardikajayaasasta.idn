<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Hotel Reservasi'">Form Reservasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-building"></i> Hotel Reservasi
            </a>
            <span class="navbar-text text-light">
                <i class="bi bi-person-circle"></i> Muhammad Rido
            </span>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Beranda</a></li>
                <li class="breadcrumb-item active" th:text="${pageTitle}">Form</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-plus-circle'"></i>
                            <span th:text="${isEdit} ? 'Edit Reservasi' : 'Form Reservasi Baru'">Form</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Alert Error -->
                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- Form -->
                        <form
                            th:action="${isEdit} ? @{/reservasi/update/{id}(id=${reservasi.id})} : @{/reservasi/simpan}"
                            th:object="${reservasi}" method="post">

                            <!-- Nama Tamu -->
                            <div class="mb-3">
                                <label for="namaTamu" class="form-label fw-semibold">
                                    <i class="bi bi-person"></i> Nama Tamu <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="namaTamu" class="form-control form-control-lg"
                                    th:field="*{namaTamu}" placeholder="Masukkan nama lengkap tamu..."
                                    th:classappend="${#fields.hasErrors('namaTamu')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('namaTamu')}"
                                    th:errors="*{namaTamu}">Error</div>
                            </div>

                            <!-- Tipe Kamar -->
                            <div class="mb-3">
                                <label for="tipeKamar" class="form-label fw-semibold">
                                    <i class="bi bi-door-open"></i> Tipe Kamar <span class="text-danger">*</span>
                                </label>
                                <select id="tipeKamar" class="form-select form-select-lg" th:field="*{tipeKamar}"
                                    th:classappend="${#fields.hasErrors('tipeKamar')} ? 'is-invalid' : ''">
                                    <option value="">-- Pilih Tipe Kamar --</option>
                                    <option value="Standard">Standard (10 kamar tersedia)</option>
                                    <option value="Deluxe">Deluxe (5 kamar tersedia)</option>
                                    <option value="Suite">Suite (3 kamar tersedia)</option>
                                    <option value="President Suite">President Suite (1 kamar tersedia)</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('tipeKamar')}"
                                    th:errors="*{tipeKamar}">Error</div>
                            </div>

                            <!-- Tanggal Check-In & Check-Out -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tanggalCheckIn" class="form-label fw-semibold">
                                        <i class="bi bi-calendar-check"></i> Tanggal Check-In <span
                                            class="text-danger">*</span>
                                    </label>
                                    <input type="date" id="tanggalCheckIn" class="form-control form-control-lg"
                                        th:field="*{tanggalCheckIn}"
                                        th:classappend="${#fields.hasErrors('tanggalCheckIn')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tanggalCheckIn')}"
                                        th:errors="*{tanggalCheckIn}">Error</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="tanggalCheckOut" class="form-label fw-semibold">
                                        <i class="bi bi-calendar-x"></i> Tanggal Check-Out <span
                                            class="text-danger">*</span>
                                    </label>
                                    <input type="date" id="tanggalCheckOut" class="form-control form-control-lg"
                                        th:field="*{tanggalCheckOut}"
                                        th:classappend="${#fields.hasErrors('tanggalCheckOut')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tanggalCheckOut')}"
                                        th:errors="*{tanggalCheckOut}">Error</div>
                                </div>
                            </div>

                            <!-- Tombol Submit -->
                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" class="btn btn-primary btn-lg flex-fill">
                                    <i th:class="${isEdit} ? 'bi bi-save' : 'bi bi-check-circle'"></i>
                                    <span th:text="${isEdit} ? 'Simpan Perubahan' : 'Buat Reservasi'">Submit</span>
                                </button>
                                <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
                                    <i class="bi bi-arrow-left"></i> Batal
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-light text-center py-3">
        <small>&copy; 2026 Muhammad Rido - Tugas Pemrograman 2 | Spring Boot + Thymeleaf + MySQL</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
